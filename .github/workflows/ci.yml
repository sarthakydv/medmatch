# Continuous integration for the Medical Entries Data Pipeline & Search API.
#
# Mirrors ./init.sh: install deps (runtime + dev) -> compileall -> pytest ->
# ruff check -> ruff format --check -> mypy. Runs on every push and pull
# request to dev and main. Pinned to the project's declared minimum (3.11,
# per pyproject.toml) and the Docker image's base (3.12, per Dockerfile) so a
# regression on either supported interpreter is caught.

name: CI

"on":
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# Cancel a superseded in-flight run when a new commit lands on the same ref,
# so we don't burn runner minutes on stale jobs.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          # Small cache speed-up: cache the pip download dir keyed on the
          # requirements files so unchanged deps install from cache.
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Compile (syntax check)
        run: python -m compileall -q medical_app

      - name: Run tests
        run: python -m pytest -q

      - name: Lint (ruff check)
        run: ruff check .

      - name: Format check (ruff format)
        run: ruff format --check .

      - name: Type check (mypy)
        run: mypy medical_app
